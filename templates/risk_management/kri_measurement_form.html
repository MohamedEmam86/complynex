{% extends 'base.html' %}
{% block title %}{{ _('Record Measurement') }} - ComplyNex CMS{% endblock %}
{% block content %}
<div class="container-fluid">
    <h3 class="mb-4">{{ _('Record Measurement') }} - {{ kri.kri_name }}</h3>
    <div class="card">
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ _('Measurement Date') }}</label>
                        <input type="date" name="measurement_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ _('Actual Value') }}</label>
                        <input type="number" step="0.01" name="actual_value" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Notes') }}</label>
                    <textarea name="notes" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                <a href="{{ url_for('risk_management.kris_dashboard') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
