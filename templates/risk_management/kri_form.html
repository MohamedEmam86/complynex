{% extends 'base.html' %}
{% block title %}{{ _('New KRI') }} - ComplyNex CMS{% endblock %}
{% block content %}
<div class="container-fluid">
    <h3 class="mb-4">{{ _('New Key Risk Indicator') }}</h3>
    <div class="card">
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">{{ _('KRI Name') }}</label>
                        <input type="text" name="kri_name" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Linked Risk (optional)') }}</label>
                        <select name="risk_id" class="form-select">
                            <option value="">-</option>
                            {% for r in risks %}<option value="{{ r.id }}">{{ r.risk_id }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Description') }}</label>
                    <textarea name="kri_description" class="form-control" rows="2"></textarea>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">{{ _('Unit of Measure') }}</label>
                        <input type="text" name="unit_of_measure" class="form-control" placeholder="{{ _('%%, count, EGP, days') }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">{{ _('Frequency') }}</label>
                        <select name="measurement_frequency" class="form-select">
                            {% for f in ['DAILY', 'WEEKLY', 'MONTHLY', 'QUARTERLY'] %}<option value="{{ f }}">{{ f|label }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">{{ _('Direction') }}</label>
                        <select name="direction" class="form-select">
                            <option value="UPPER">{{ _('Higher is worse') }}</option>
                            <option value="LOWER">{{ _('Lower is worse') }}</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">{{ _('Owner') }}</label>
                        <select name="owner_id" class="form-select">
                            <option value="">-</option>
                            {% for u in users %}<option value="{{ u.id }}">{{ u.first_name }} {{ u.last_name }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Target Value') }}</label>
                        <input type="number" step="0.01" name="target_value" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Warning Threshold (Amber)') }}</label>
                        <input type="number" step="0.01" name="warning_threshold" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Breach Threshold (Red)') }}</label>
                        <input type="number" step="0.01" name="breach_threshold" class="form-control">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                <a href="{{ url_for('risk_management.kris_dashboard') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
