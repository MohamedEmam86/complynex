{% extends 'base.html' %}
{% block title %}{{ _('New Control') }} - ComplyNex CMS{% endblock %}
{% block content %}
<div class="container-fluid">
    <h3 class="mb-4">{{ _('New Control') }}</h3>
    <div class="card">
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Control Code') }}</label>
                        <input type="text" name="control_code" class="form-control" placeholder="{{ _('e.g. CTL-AML-014') }}" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">{{ _('Control Name') }}</label>
                        <input type="text" name="control_name" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Description') }}</label>
                    <textarea name="control_description" class="form-control" rows="3"></textarea>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Control Type') }}</label>
                        <select name="control_type" class="form-select" required>
                            {% for t in ['PREVENTIVE', 'DETECTIVE', 'CORRECTIVE'] %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Nature') }}</label>
                        <select name="control_nature" class="form-select">
                            {% for n in ['MANUAL', 'AUTOMATED', 'IT_DEPENDENT'] %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ _('Testing Frequency') }}</label>
                        <select name="testing_frequency" class="form-select">
                            {% for f in ['MONTHLY', 'QUARTERLY', 'SEMI_ANNUAL', 'ANNUAL', 'AD_HOC'] %}<option value="{{ f }}">{{ f }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ _('Control Owner') }}</label>
                        <select name="control_owner_id" class="form-select">
                            <option value="">-</option>
                            {% for u in users %}<option value="{{ u.id }}">{{ u.first_name }} {{ u.last_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ _('Department') }}</label>
                        <select name="department_id" class="form-select">
                            <option value="">-</option>
                            {% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
                <a href="{{ url_for('risk_management.controls_list') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
