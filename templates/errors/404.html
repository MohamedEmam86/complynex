{% extends 'base.html' %}
{% block title %}{{ _('404 - Not Found') }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-muted">404</h1>
        <h2 class="mb-3">{{ _('Record Not Found') }}</h2>
        <p class="text-muted mb-4">{{ _('The page or record you are looking for does not exist or has been removed.') }}</p>
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house me-2"></i>{{ _('Back to Dashboard') }}
        </a>
    </div>
</div>
{% endblock %}
