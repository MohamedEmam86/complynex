{% extends 'base.html' %}
{% block title %}{{ _('403 - Access Denied') }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-warning">403</h1>
        <h2 class="mb-3">{{ _('Access Denied') }}</h2>
        <p class="text-muted mb-4">{{ _('You do not have permission to access this resource.') }}</p>
        <a href="/" class="btn btn-primary"><i class="bi bi-house me-2"></i>{{ _('Back to Dashboard') }}</a>
    </div>
</div>
{% endblock %}
