{% extends 'base.html' %}

{% block title %}{{ 'Edit' if regulator else 'New' }} Regulator - ComplyNex CMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ 'Edit' if regulator else 'New' }} Regulator</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('reporting.list_regulators') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> {{ _('Back to List') }}
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('Regulator Name') }} <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="regulator_name"
                                value="{{ regulator.regulator_name if regulator else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('Code') }} <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="regulator_code"
                                value="{{ regulator.regulator_code if regulator else '' }}" placeholder="{{ _('e.g. FRA') }}"
                                required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">{{ _('Website') }}</label>
                        <input type="url" class="form-control" name="website"
                            value="{{ regulator.website if regulator else '' }}" placeholder="{{ _('https://...') }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('Contact Email') }}</label>
                            <input type="email" class="form-control" name="contact_email"
                                value="{{ regulator.contact_email if regulator else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('Contact Phone') }}</label>
                            <input type="text" class="form-control" name="contact_phone"
                                value="{{ regulator.contact_phone if regulator else '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">{{ _('Description') }}</label>
                        <textarea class="form-control" name="description"
                            rows="3">{{ regulator.description if regulator else '' }}</textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="is_active" id="isActive" {{ 'checked' if
                            (not regulator or regulator.is_active) else '' }}>
                        <label class="form-check-label" for="isActive">{{ _('Active') }}</label>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('reporting.list_regulators') }}" class="btn btn-light me-md-2">{{ _('Cancel') }}</a>
                        <button type="submit" class="btn btn-primary">{{ _('Save Regulator') }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
