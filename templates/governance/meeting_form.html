{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">{{ _('Edit Meeting') if meeting else _('Schedule New
                        Meeting') }}</h6>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ _('Meeting Type') }}</label>
                                <select name="meeting_type" class="form-select" required>
                                    <option value="BOARD" {{ 'selected' if meeting and meeting.meeting_type=='BOARD'
                                        else '' }}>{{ _('BOARD') }}</option>
                                    <option value="AUDIT_COMMITTEE" {{ 'selected' if meeting and
                                        meeting.meeting_type=='AUDIT_COMMITTEE' else '' }}>{{ _('AUDIT COMMITTEE') }}</option>
                                    <option value="RISK_COMMITTEE" {{ 'selected' if meeting and
                                        meeting.meeting_type=='RISK_COMMITTEE' else '' }}>{{ _('RISK COMMITTEE') }}</option>
                                    <option value="COMPLIANCE_COMMITTEE" {{ 'selected' if meeting and
                                        meeting.meeting_type=='COMPLIANCE_COMMITTEE' else '' }}>{{ _('COMPLIANCE COMMITTEE') }}
                                    </option>
                                    <option value="NOMREM_COMMITTEE" {{ 'selected' if meeting and
                                        meeting.meeting_type=='NOMREM_COMMITTEE' else '' }}>{{ _('NOMREM COMMITTEE') }}</option>
                                    <option value="REGULAR" {{ 'selected' if meeting and meeting.meeting_type=='REGULAR'
                                        else '' }}>{{ _('REGULAR') }}</option>
                                    <option value="EXTRAORDINARY" {{ 'selected' if meeting and
                                        meeting.meeting_type=='EXTRAORDINARY' else '' }}>{{ _('EXTRAORDINARY') }}</option>
                                    <option value="EMERGENCY" {{ 'selected' if meeting and
                                        meeting.meeting_type=='EMERGENCY' else '' }}>{{ _('EMERGENCY') }}</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ _('Committee (Optional)') }}</label>
                                <select name="committee_id" class="form-select">
                                    <option value="">-- {{ _('Select Committee') }} --</option>
                                    {% for committee in committees %}
                                    <option value="{{ committee.id }}" {{ 'selected' if meeting and
                                        meeting.committee_id==committee.id else '' }}>{{ committee.committee_name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ _('Meeting Date') }}</label>
                                <input type="date" name="meeting_date" class="form-control" required
                                    value="{{ meeting.meeting_date if meeting else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ _('Meeting Time') }}</label>
                                <input type="time" name="meeting_time" class="form-control"
                                    value="{{ meeting.meeting_time if meeting else '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ _('Location / Link') }}</label>
                                <input type="text" name="location" class="form-control"
                                    value="{{ meeting.location if meeting else '' }}"
                                    placeholder="{{ _('Boardroom or Teams/Zoom Link') }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">{{ _('Status') }}</label>
                                <select name="status" class="form-select">
                                    <option value="SCHEDULED" {{ 'selected' if meeting and meeting.status=='SCHEDULED'
                                        else '' }}>{{ _('SCHEDULED') }}</option>
                                    <option value="IN_PROGRESS" {{ 'selected' if meeting and
                                        meeting.status=='IN_PROGRESS' else '' }}>{{ _('IN_PROGRESS') }}</option>
                                    <option value="COMPLETED" {{ 'selected' if meeting and meeting.status=='COMPLETED'
                                        else '' }}>{{ _('COMPLETED') }}</option>
                                    <option value="CANCELED" {{ 'selected' if meeting and meeting.status=='CANCELED'
                                        else '' }}>{{ _('CANCELED') }}</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">{{ _('Reference / Title') }}</label>
                            <input type="text" name="meeting_reference" class="form-control"
                                value="{{ meeting.meeting_reference if meeting else '' }}"
                                placeholder="{{ _('e.g. Q1 2025 Board Meeting') }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">{{ _('Agenda') }}</label>
                            <textarea name="agenda" class="form-control"
                                rows="4">{{ meeting.agenda if meeting else '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">{{ _('Select Attendees') }}</label>
                            <div class="row row-cols-1 row-cols-md-2 g-2 overflow-auto" style="max-height: 200px;">
                                {% for member in members %}
                                <div class="col">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="attendees"
                                            value="{{ member.id }}" id="attendee_{{ member.id }}">
                                        <label class="form-check-label" for="attendee_{{ member.id }}">
                                            {{ member.member_name }}
                                        </label>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-calendar-check"></i> {{ _('Save Changes') if meeting else _('Schedule')
                                }}
                            </button>
                            <a href="{{ url_for('governance.list_meetings') }}" class="btn btn-secondary">
                                {{ _('Cancel') }}
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
