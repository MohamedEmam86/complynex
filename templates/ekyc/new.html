{% extends "base.html" %}

{% block title %}{{ _('New eKYC Session') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">{{ _('New eKYC Session') }}</h1>
    <div class="card" style="max-width: 600px;">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label">{{ _('Document Type') }}</label>
                    <select name="document_type" class="form-select">
                        {% for value, label in document_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Customer Reference (optional)') }}</label>
                    <input type="text" name="customer_reference" class="form-control"
                           placeholder="{{ _('e.g. merchant ID, application number') }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Customer Language') }}</label>
                    <select name="locale" class="form-select">
                        <option value="ar" selected>{{ _('Arabic') }}</option>
                        <option value="en">{{ _('English') }}</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">{{ _('Create Session') }}</button>
                <a href="{{ url_for('ekyc.dashboard') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
