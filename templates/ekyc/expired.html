{% extends "base.html" %}

{% block title %}{{ _('Link Unavailable') }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="card mt-4">
        <div class="card-body text-center py-5">
            <i class="bi bi-exclamation-triangle display-4 text-warning"></i>
            <h4 class="mt-3">{{ _('This verification link is invalid or has expired.') }}</h4>
            <p class="text-muted">{{ _('Please contact the organization that sent you this link to request a new one.') }}</p>
        </div>
    </div>
</div>
{% endblock %}
