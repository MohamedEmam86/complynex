# ComplyNex site — rendered by install_server.sh (__DOMAIN__, __APP__, __CERT__, __KEY__).
server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 50M;
    server_tokens off;

    location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8000; }
    location /academy/admin/ {
        client_max_body_size 430M; proxy_read_timeout 600s; proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        alias __APP__/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
}
