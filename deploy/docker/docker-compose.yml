# ComplyNex — container stack. Usage (from the repository root):
#   cp deploy/env.example .env   # fill the __generate__ values; set POSTGRES_HOST=db, ES host below
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#   docker compose -f deploy/docker/docker-compose.yml exec db psql -U postgres -d complynex_db -f /baseline/schema.sql
# Scheduled jobs (sanctions update, ES sync, regulatory checks…) run in the "jobs" service.
services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: complynex_db, POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?set it}"}
    volumes: [pgdata:/var/lib/postgresql/data, ../../database/baseline:/baseline:ro]
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${ES_ELASTIC_PASSWORD:?set it}"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes: [esdata:/usr/share/elasticsearch/data]
    restart: unless-stopped
  web:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    env_file: ../../.env
    environment: {POSTGRES_HOST: db, REDIS_URL: "redis://redis:6379/0", ES_HOST: es, ELASTICSEARCH_URL: "http://es:9200",
                  SEMANTIC_SERVICE_URL: "http://semantic:8100"}
    volumes: [uploads:/app/uploads, ekyc:/app/ekyc_storage, logs:/app/logs]
    depends_on: [db, redis, es]
    restart: unless-stopped
  semantic:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    env_file: ../../.env
    environment: {POSTGRES_HOST: db, SEMANTIC_MATCHER_ENABLED: "true"}
    command: ["gunicorn", "--worker-class", "sync", "--workers", "1", "--timeout", "120", "--bind", "0.0.0.0:8100", "screening.semantic_service:create_service_app()"]
    depends_on: [db]
    restart: unless-stopped
  ekyc-worker:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    env_file: ../../.env
    environment: {POSTGRES_HOST: db, REDIS_URL: "redis://redis:6379/0"}
    command: ["python", "-m", "ekyc.worker"]
    volumes: [ekyc:/app/ekyc_storage]
    depends_on: [db, redis]
    restart: unless-stopped
  events-worker:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    env_file: ../../.env
    environment: {POSTGRES_HOST: db, REDIS_URL: "redis://redis:6379/0"}
    command: ["python", "-m", "events.worker"]
    depends_on: [db, redis]
    restart: unless-stopped
  jobs:
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile}
    env_file: ../../.env
    environment: {POSTGRES_HOST: db, REDIS_URL: "redis://redis:6379/0", ES_HOST: es, ELASTICSEARCH_URL: "http://es:9200"}
    command: ["python", "deploy/docker/jobs.py"]
    depends_on: [db, redis, es]
    restart: unless-stopped
  nginx:
    image: nginx:1.27
    ports: ["80:80", "443:443"]
    volumes: [../nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro, ../../static:/app/static:ro, ./certs:/etc/nginx/certs:ro]
    depends_on: [web]
    restart: unless-stopped
volumes: {pgdata: {}, esdata: {}, uploads: {}, ekyc: {}, logs: {}}
